name: ner_landslide_mobile
description: Offline-first Mobile App for Landslide Early Warning in North Eastern Region (SIH 2026 - SIH26001).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Offline Storage & Caching
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  # Network & Sync
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  # Push Alerts & Geolocation
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  geolocator: ^11.0.0
  # Offline Mapping
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
